[project]
name = "tiferet-plot"
dynamic = ["version"]
description = "A Tiferet library for defining, persisting, and rendering plots, with Matplotlib as the first renderer."
authors = [
    { name = "Andrew Shatz, Great Strength Systems", email = "andrew@greatstrength.me" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "tiferet>=2.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-plot"
Repository = "https://github.com/greatstrength/tiferet-plot"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "tiferet_plot.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "tiferet_plot",
    "tiferet_plot.blueprints",
    "tiferet_plot.contexts",
    "tiferet_plot.domain",
    "tiferet_plot.events",
    "tiferet_plot.interfaces",
    "tiferet_plot.mappers",
    "tiferet_plot.repos",
    "tiferet_plot.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
